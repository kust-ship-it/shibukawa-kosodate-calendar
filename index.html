<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>渋川子育てカレンダー</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
</head>
<body>
<header class="header">
  <h1 class="hw">渋川子育てカレンダー</h1>
  <p class="lead">渋川市の子育て支援センター・子育てサロン・寄せられたイベント情報を一覧できます。</p>
</header>

<div class="view-switch hw" role="tablist">
  <button class="view-tab is-active" id="view-tab-events">予定を見る
    <svg class="wavy-underline" viewBox="0 0 60 8" preserveAspectRatio="none" aria-hidden="true">
      <path d="M2,5 Q15,1 30,4 T58,3" stroke="var(--river-deep)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    </svg>
  </button>
  <button class="view-tab" id="view-tab-facilities">施設をさがす
    <svg class="wavy-underline" viewBox="0 0 60 8" preserveAspectRatio="none" aria-hidden="true">
      <path d="M2,5 Q15,1 30,4 T58,3" stroke="var(--river-deep)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    </svg>
  </button>
</div>

<main>
  <section class="view-panel is-active" id="panel-events">
    <div id="events-panel-body">
      <p class="loading">読み込み中...</p>
    </div>
  </section>

  <section class="view-panel" id="panel-facilities">
    <div id="facility-map"></div>
    <div class="facility-search-controls">
      <input type="search" id="facility-search" class="facility-search-input" placeholder="施設名でさがす" aria-label="施設名でさがす">
      <div class="facility-type-chips" role="group" aria-label="施設種別で絞り込む">
        <button type="button" class="facility-type-chip is-active" data-type="">すべて</button>
        <button type="button" class="facility-type-chip" data-type="公共の遊び場">公共の遊び場</button>
        <button type="button" class="facility-type-chip" data-type="保育園・幼稚園">保育園・幼稚園</button>
        <button type="button" class="facility-type-chip" data-type="公民館">公民館</button>
      </div>
      <button type="button" id="facility-favorite-toggle" class="facility-favorite-toggle" aria-pressed="false">
        <span id="facility-favorite-toggle-icon" aria-hidden="true"></span><span>お気に入りだけ見る</span>
      </button>
    </div>
    <div id="facility-groups"></div>
  </section>
</main>

<footer class="footer">
  <p id="updated-at"></p>
</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="app.js"></script>
</body>
</html>

name: Deploy site

on:
  schedule:
    # JST 6:00 / 12:00 / 18:00 に相当（UTC基準）
    - cron: "0 21,3,9 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch data from Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python fetch_data.py

      # NotionのイベントDB・施設マスタが誤操作等で失われた場合の復元用に、
      # 取得したdata.jsonを1日1回リポジトリへ残しておく（data.json自体はdist生成物なので.gitignore対象）。
      # [skip ci]を付けてpushしないと、この後のgit pushがpushトリガーで自分自身を再起動させてしまう。
      # 手動デプロイと定期実行が重なる等で他のpushとレースした場合に備え、失敗時は
      # pull --rebaseしてから1回だけ再試行する。
      - name: Backup data.json snapshot
        run: |
          mkdir -p backups
          DATE=$(TZ=Asia/Tokyo date +%Y-%m-%d)
          cp data.json "backups/data-${DATE}.json"
          git -c user.name="kust-ship-it" -c user.email="kust-ship-it@users.noreply.github.com" add backups/
          git diff --staged --quiet || git -c user.name="kust-ship-it" -c user.email="kust-ship-it@users.noreply.github.com" commit -m "backup: data.json snapshot ${DATE} [skip ci]"
          git push || (git -c user.name="kust-ship-it" -c user.email="kust-ship-it@users.noreply.github.com" pull --rebase origin main && git push)

      - name: Prepare dist
        run: |
          mkdir -p dist
          cp index.html style.css app.js data.json CNAME sitemap.xml robots.txt 404.html legal.html dist/
          cp -r assets dist/assets

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
